<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Peaky Minds - admin{% endblock %}</title>
  <meta name="description" content="{% block description %}Внутренний интерфейс управления Peaky Minds.{% endblock %}">
  <meta name="theme-color" content="#17181d">
  <script>
    (function () {
      try {
        var stored = localStorage.getItem("pm-theme");
        var systemDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
        var theme = stored || (systemDark ? "dark" : "light");
        document.documentElement.dataset.theme = theme === "dark" ? "dark" : "light";
        document.documentElement.style.colorScheme = theme === "dark" ? "dark" : "light";
      } catch (error) {
        document.documentElement.dataset.theme = "light";
      }
    })();
  </script>
  <link rel="icon" type="image/x-icon" href="/assets/img/favicon.ico">
  <link rel="shortcut icon" href="/assets/img/favicon.ico">
  <link rel="apple-touch-icon" href="/assets/img/favicon.ico">
  <link rel="stylesheet" href="/assets/css/styles.css?v=20260704-admin-polish-1">
  {% block extra_head %}{% endblock %}
</head>
<body class="shell-admin {% block body_class %}{% endblock %}" {% block body_attrs %}{% endblock %}>
  <header class="site-header site-header--admin">
    <div class="container site-header__inner">
      <div class="logo logo--marketing logo--admin">
        <a class="logo__brand-link" href="/">
          <img src="/assets/img/logo.png" alt="Логотип IT‑школы Peaky Minds">
          <span>Peaky Minds</span>
        </a>
        <a class="logo__admin-link" href="https://school.peaky-minds.ru/admin">Admin</a>
      </div>

      <nav class="nav-links nav-links--admin">
        <a href="/admin">Обзор</a>
        <a href="/admin?view=leads">Заявки</a>
        <a href="/admin?view=agreements">Договоры</a>
        <a href="/admin?view=lessons">Занятия</a>
        <a href="/admin?view=teachers">Преподаватели</a>
      </nav>

      <div class="site-header__actions">
        <button class="theme-toggle" type="button" data-theme-toggle aria-label="Переключить тему" title="Переключить тему">
          <span class="theme-toggle__icon theme-toggle__icon--moon" aria-hidden="true">
            <svg viewBox="0 0 24 24" focusable="false"><path d="M20.5 15.2A8.2 8.2 0 0 1 8.8 3.5a8.6 8.6 0 1 0 11.7 11.7Z"/></svg>
          </span>
          <span class="theme-toggle__icon theme-toggle__icon--sun" aria-hidden="true">
            <svg viewBox="0 0 24 24" focusable="false"><circle cx="12" cy="12" r="4"/><path d="M12 2v2.2M12 19.8V22M4.9 4.9l1.6 1.6M17.5 17.5l1.6 1.6M2 12h2.2M19.8 12H22M4.9 19.1l1.6-1.6M17.5 6.5l1.6-1.6"/></svg>
          </span>
        </button>
        <a class="btn btn-secondary" href="/">Сайт</a>
        {% if user %}
        <a class="nav-user nav-user--marketing" href="/account">
          <span class="nav-user__label">Аккаунт</span>
          <span class="avatar {% if user_avatar.variant == 'email' %}avatar--email{% endif %}">
            {% if user_avatar.url %}
            <img src="{{ user_avatar.url }}" alt="Аватар профиля" loading="lazy"
              onload="this.parentElement.classList.add('has-image')"
              onerror="this.parentElement.classList.remove('has-image'); this.style.display='none'">
            {% endif %}
            <span class="avatar-initial">{{ user_avatar.initial }}</span>
          </span>
        </a>
        {% endif %}
        <a class="btn btn-primary" href="/logout">Выйти</a>
      </div>
    </div>
  </header>

  <main class="site-main site-main--admin">
    {% block content %}{% endblock %}
  </main>

  <script>
    window.pmRuntimeConfig = Object.assign(window.pmRuntimeConfig || {}, {
      analytics: {
        yandexMetrikaId: "{{ yandex_metrika_id }}",
        gaMeasurementId: "{{ ga_measurement_id }}"
      }
    });
  </script>
  <script src="/assets/js/main.js?v=20260702-course-filter"></script>
  {% block extra_scripts %}{% endblock %}
</body>
</html>
