<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VK приложение — Peaky Minds</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Prata&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/styles.css">
  <script src="/assets/vendor/vk-bridge.min.js"></script>
</head>
<body class="admin-page">
  <div class="bg-orb orb-1"></div>
  <div class="bg-orb orb-2"></div>
  <div class="bg-orb orb-3"></div>

  <main class="container" style="padding: 120px 0;">
    <section class="panel admin-hero" style="grid-template-columns: 1fr;">
      <div class="admin-hero__content">
        <div class="account-profile">
          <div class="logo small">
            <img src="/assets/img/logo.png" alt="Логотип IT‑школы Peaky Minds">
            <span>IT‑школа Peaky Minds</span>
          </div>
        </div>
        <div>
          <h1>Вход через VK</h1>
          <p>Это страница приложения VK. Откройте её внутри VK и нажмите кнопку входа.</p>
        </div>
      </div>
      <div class="admin-hero__actions vk-app-actions">
        <button class="btn btn-primary vk-app-button" type="button" id="vk-bridge-login" onclick="vkAppLogin()">Войти через VK</button>
        <a class="btn btn-secondary" href="/">На главную</a>
      </div>
    </section>
    <section class="panel" style="margin-top: 18px;">
      <div class="admin-section-head">
        <h2 class="section-title">VK Bridge Debug</h2>
      </div>
      <pre id="vk-debug" style="white-space: pre-wrap; font-size: 0.85rem;">init...</pre>
    </section>
  </main>

  <script>
    const debug = document.getElementById("vk-debug");
    const log = (msg) => {
      if (debug) {
        debug.textContent = `${debug.textContent}\n${msg}`;
      }
      console.log(msg);
    };
    if (window.vkBridge && typeof window.vkBridge.send === "function") {
      window.vkBridge.send("VKWebAppInit")
        .then(function () {
          log("VKWebAppInit: ok");
        })
        .catch(function (e) {
          log("VKWebAppInit: failed " + JSON.stringify(e));
        });
      if (window.vkBridge.subscribe) {
        window.vkBridge.subscribe(function (event) {
          if (event && event.detail) {
            log("event: " + JSON.stringify(event.detail));
          }
        });
      }
    } else {
      log("vkBridge not available");
    }
    function vkAppLogin() {
      if (!window.vkBridge || typeof window.vkBridge.send !== "function") {
        alert("VK Bridge не доступен. Откройте приложение внутри VK.");
        return;
      }
      log("VKWebAppGetUserInfo: send");
      const timer = setTimeout(function () {
        log("VKWebAppGetUserInfo: timeout");
        alert("VK Bridge не отвечает. Проверьте, что страница открыта внутри VK Mini Apps.");
      }, 8000);
      window.vkBridge.send("VKWebAppGetUserInfo")
        .then(function (data) {
          clearTimeout(timer);
          log("VKWebAppGetUserInfo: ok " + JSON.stringify(data));
          return fetch("/login/vk-bridge", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            credentials: "include",
            body: JSON.stringify(data),
          });
        })
        .then(function (response) {
          return response.json();
        })
        .then(function (payload) {
          if (!payload || !payload.token) {
            throw new Error("no_token");
          }
          return window.vkBridge.send("VKWebAppOpenLink", {
            url: `${window.location.origin}/vk-auth?token=${encodeURIComponent(payload.token)}`,
          });
        })
        .then(function () {
          window.location.href = "/";
        })
        .catch(function () {
          clearTimeout(timer);
          log("VKWebAppGetUserInfo: failed");
          alert("Не удалось авторизоваться через VK.");
        });
    }
  </script>
</body>
</html>
